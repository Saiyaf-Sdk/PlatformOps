name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: |
          set -o pipefail
          mvn -B -ntp verify 2>&1 | tee build.log
      - name: Keep logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: |
            Backend/build.log
            Backend/target/surefire-reports/*.txt
          if-no-files-found: ignore

  frontend:
    name: Frontend · type-check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Keep logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-log
          path: Frontend/build.log
          if-no-files-found: ignore

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: Backend
          push: false
          tags: platformops-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: Frontend
          push: false
          tags: platformops-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Writes a readable summary of every run to the "ci-reports" branch (reports/latest.md),
  # so results can be read without opening the Actions UI.
  report:
    name: Publish CI report
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker]
    if: always() && github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: logs
        continue-on-error: true
      - name: Compose and push report
        env:
          GH_TOKEN: ${{ github.token }}
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          DOCKER: ${{ needs.docker.result }}
        run: |
          set +e
          R=report.md
          {
            echo "# CI run ${GITHUB_RUN_NUMBER}"
            echo
            echo "- ref: \`${GITHUB_REF_NAME}\` · commit: \`${GITHUB_SHA}\`"
            echo "- backend: **${BACKEND}** · frontend: **${FRONTEND}** · docker: **${DOCKER}**"
            echo
            if [ -f logs/backend-log/build.log ]; then
              echo "## Backend"
              echo '```'
              grep -E "Tests run:|BUILD SUCCESS|BUILD FAILURE" logs/backend-log/build.log | tail -n 20
              echo '```'
              if [ "$BACKEND" != "success" ]; then
                echo "### Errors"
                echo '```'
                grep -E "^\[ERROR\]|Caused by:|Exception|expected|but was" logs/backend-log/build.log | grep -vE "^\[ERROR\] *$|Re-run Maven|full stack trace|For more information|Help 1|http://cwiki" | head -n 200
                echo '```'
                echo "### Failing tests"
                echo '```'
                for f in $(find logs/backend-log -name "*.txt"); do
                  if grep -qE "FAILURE|ERROR" "$f"; then head -n 80 "$f"; echo "----"; fi
                done | head -n 400
                echo '```'
              fi
            fi
            if [ -f logs/frontend-log/build.log ]; then
              echo "## Frontend"
              echo '```'
              tail -n 60 logs/frontend-log/build.log
              echo '```'
            fi
          } > "$R"
          git init -q repo && cd repo
          git config user.name "platformops-ci"
          git config user.email "platformops-ci@users.noreply.github.com"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            git fetch -q "$REMOTE" ci-reports && git checkout -q -B ci-reports FETCH_HEAD || git checkout -q --orphan ci-reports
            mkdir -p reports
            cp "../$R" "reports/latest.md"
            cp "../$R" "reports/run-${GITHUB_RUN_NUMBER}.md"
            git add reports
            git commit -q -m "CI report ${GITHUB_RUN_NUMBER} (${GITHUB_REF_NAME})"
            git push -q "$REMOTE" HEAD:ci-reports && break
            sleep 3
          done
