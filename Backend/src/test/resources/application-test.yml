spring:
  datasource:
    url: jdbc:h2:mem:platformops;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
app:
  pipeline:
    stage-delay: PT0.02S
    failure-rate: 0.0
  seed:
    enabled: false
  security:
    login-rate-limit-per-minute: 1000
logging:
  level:
    com.platformops: WARN
