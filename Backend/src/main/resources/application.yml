spring:
  application:
    name: platformops-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/platformops}
    username: ${DB_USERNAME:platformops}
    password: ${DB_PASSWORD:Mydata1234}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
  shutdown: graceful
  # set to 'framework' when running behind nginx / an ingress so client IPs come from X-Forwarded-For
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    # Base64-encoded HMAC key, at least 256 bits. ALWAYS override JWT_SECRET outside local development.
    secret: ${JWT_SECRET:ZGV2LW9ubHktcGxhdGZvcm1vcHMtc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Njc4OTA=}
    issuer: platformops
    access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TTL:P7D}
  security:
    max-failed-logins: 5
    lockout-duration: PT15M
    login-rate-limit-per-minute: 20
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5174,http://127.0.0.1:5173,http://localhost:4173,http://localhost:3000}
  pipeline:
    stage-delay: ${PIPELINE_STAGE_DELAY:PT2.5S}
    failure-rate: ${PIPELINE_FAILURE_RATE:0.05}
    worker-threads: 4
  seed:
    enabled: ${SEED_DEMO_DATA:true}

logging:
  level:
    root: INFO
    com.platformops: INFO
