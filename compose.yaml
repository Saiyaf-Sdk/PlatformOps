# ==============================================================================
# PlatformOps — Multi-Container Local Stack
# Stage 2: Docker Compose
# Architecture: Browser -> Frontend (Nginx) -> Backend (Spring Boot) -> PostgreSQL
# ==============================================================================
name: platformops

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: platformops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-platformops}
      POSTGRES_USER: ${POSTGRES_USER:-platformops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platformops}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - platformops_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platformops} -d ${POSTGRES_DB:-platformops}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      platformops-network:
        aliases:
          - postgres
          - db

  # ----------------------------------------------------------------------------
  # Spring Boot Backend API Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    image: platformops-backend:latest
    container_name: platformops-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database connection via Docker internal DNS
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-platformops}
      DB_USERNAME: ${POSTGRES_USER:-platformops}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-platformops}
      PORT: 8081
      # Security & JWT configuration
      JWT_SECRET: ${JWT_SECRET:-ZGV2LW9ubHktcGxhdGZvcm1vcHMtc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Njc4OTA=}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-PT15M}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-P7D}
      # CORS: Allow frontend container, reverse proxy, and local Vite dev server
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://127.0.0.1,http://localhost:5173,http://127.0.0.1:5173}
      # Application settings
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      PIPELINE_STAGE_DELAY: ${PIPELINE_STAGE_DELAY:-PT2.5S}
      PIPELINE_FAILURE_RATE: ${PIPELINE_FAILURE_RATE:-0.05}
      FORWARD_HEADERS_STRATEGY: framework
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      platformops-network:
        aliases:
          - backend
          - api

  # ----------------------------------------------------------------------------
  # React + Vite Frontend (Served by Nginx Reverse Proxy)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    image: platformops-frontend:latest
    container_name: platformops-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      platformops-network:
        aliases:
          - frontend
          - web

# ------------------------------------------------------------------------------
# Persistent Volumes
# ------------------------------------------------------------------------------
volumes:
  platformops_postgres_data:
    name: platformops_postgres_data

# ------------------------------------------------------------------------------
# Bridge Network for Inter-Service Communication
# ------------------------------------------------------------------------------
networks:
  platformops-network:
    name: platformops-network
    driver: bridge
