apiVersion: apps/v1
kind: Deployment
metadata: { name: api, labels: { app: api } }
spec:
  replicas: 2
  selector: { matchLabels: { app: api } }
  strategy: { rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  template:
    metadata:
      labels: { app: api }
      annotations: { prometheus.io/scrape: "true", prometheus.io/path: /actuator/prometheus, prometheus.io/port: "8080" }
    spec:
      securityContext: { runAsNonRoot: true }
      containers:
        - name: api
          image: platformops-api
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: prod }
            - { name: DB_URL, value: jdbc:postgresql://db:5432/platformops }
            - { name: FORWARD_HEADERS_STRATEGY, value: framework }
            - { name: CORS_ALLOWED_ORIGINS, value: https://platformops.example.com }
          envFrom: [{ secretRef: { name: platformops-secrets } }]
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: http }, initialDelaySeconds: 20, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: http }, initialDelaySeconds: 60, periodSeconds: 10 }
          resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { memory: 1Gi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: false }
---
apiVersion: v1
kind: Service
metadata: { name: api, labels: { app: api } }
spec:
  selector: { app: api }
  ports: [{ name: http, port: 8080, targetPort: http }]
