# Copy to secret.yaml, fill in, and apply once (never commit real values):
#   kubectl -n platformops apply -f secret.yaml
# JWT_SECRET: openssl rand -base64 48
apiVersion: v1
kind: Secret
metadata: { name: platformops-secrets }
type: Opaque
stringData:
  DB_USERNAME: platformops
  DB_PASSWORD: change-me
  JWT_SECRET: change-me-base64-at-least-32-bytes
