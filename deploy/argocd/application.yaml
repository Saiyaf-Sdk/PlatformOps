# Argo CD watches deploy/k8s/overlays/prod on main; Jenkins bumps the image tag there and Argo CD rolls it out.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platformops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Saiyaf-Sdk/PlatformOps.git
    targetRevision: main
    path: deploy/k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: platformops
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
