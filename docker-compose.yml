# PlatformOps — full local stack
#   docker compose up -d --build
#   UI http://localhost:8081 · API http://localhost:8080/swagger-ui.html
#   Grafana http://localhost:3001 (admin / admin) · Prometheus http://localhost:9090
name: platformops

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: platformops
      POSTGRES_USER: platformops
      POSTGRES_PASSWORD: ${DB_PASSWORD:-platformops}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platformops -d platformops"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./Backend
    image: platformops-api:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/platformops
      DB_USERNAME: platformops
      DB_PASSWORD: ${DB_PASSWORD:-platformops}
      JWT_SECRET: ${JWT_SECRET:-ZGV2LW9ubHktcGxhdGZvcm1vcHMtc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Njc4OTA=}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      FORWARD_HEADERS_STRATEGY: framework
      CORS_ALLOWED_ORIGINS: http://localhost:8081,http://localhost:5173
    ports:
      - "8080:8080"
    restart: unless-stopped

  web:
    build: ./Frontend
    image: platformops-web:local
    depends_on:
      - api
    ports:
      - "8081:80"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata:
