# Disposable audit stack. Uses the already-built application images.
# No project volumes are mounted; PostgreSQL data lives only in tmpfs.
name: platformops-audit
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: platformops
      POSTGRES_USER: platformops
      POSTGRES_PASSWORD: audit-local-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U platformops -d platformops"]
      interval: 2s
      timeout: 3s
      retries: 20
  backend:
    image: platformops-backend:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/platformops
      DB_USERNAME: platformops
      DB_PASSWORD: audit-local-only
      PORT: 8081
      SEED_DEMO_DATA: "true"
      PIPELINE_STAGE_DELAY: PT0.4S
      PIPELINE_FAILURE_RATE: "0"
      CORS_ALLOWED_ORIGINS: http://localhost:18080,http://127.0.0.1:18080
    ports:
      - "127.0.0.1:18081:8081"
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:8081/actuator/health/readiness"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 20s
  frontend:
    image: platformops-frontend:latest
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:80"
